name: Optimise gallery images

on:
  push:
    branches:
      - b11-gallery-case-studies
    paths:
      - "incoming/gallery/**"

permissions:
  contents: write

jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Produce web-ready Gallery assets
        run: python scripts/optimise-gallery-images.py

      - name: Commit optimised assets
        run: |
          git config user.name "Form & Frame Gallery Optimiser"
          git config user.email "actions@users.noreply.github.com"
          git add -A incoming/gallery public/images/gallery
          if git diff --cached --quiet; then
            echo "No gallery changes to commit."
            exit 0
          fi
          git commit -m "B11 optimise gallery image project"
          git push
