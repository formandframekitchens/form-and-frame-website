name: Public website health (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-website-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/public-health.mjs public-health-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-health-report
          path: public-health-report.json
          retention-days: 7
