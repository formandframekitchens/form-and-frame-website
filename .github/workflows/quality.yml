name: Preview quality (intentional gate rehearsal)
on:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deliberate failure for required-check verification
        run: |
          echo "Expected failure: this verification-only draft must not merge."
          exit 1
