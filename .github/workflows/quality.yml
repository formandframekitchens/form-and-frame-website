name: Preview quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:repository
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test:guards
      - run: npm run test:delivery
      - run: npm run test:health
      - run: node --test tests/lead-metrics.test.mjs
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - run: npm run build
        env:
          VERCEL_ENV: preview
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-PREVIEWTEST
      - run: npx playwright test tests/preview-isolation.spec.ts
        env:
          VERCEL_ENV: preview
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-PREVIEWTEST
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: synthetic-test-results
          path: test-results/
          retention-days: 3
