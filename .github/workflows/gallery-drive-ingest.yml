name: Gallery Drive ingest

on:
  push:
    paths:
      - "docs/gallery/image-jobs/current.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-drive-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GALLERY_JOB_MANIFEST: docs/gallery/image-jobs/current.json
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check out the triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check active manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$GALLERY_JOB_MANIFEST" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          active=$(jq -r '.enabled // true' "$GALLERY_JOB_MANIFEST")
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.manifest.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic image and Drive dependencies
        if: steps.manifest.outputs.active == 'true'
        run: |
          python -m pip install --disable-pip-version-check \
            Pillow==11.3.0 \
            pillow-avif-plugin==1.5.2 \
            google-auth==2.40.3 \
            requests==2.32.4

      - name: Validate, ingest and optimise gallery images
        if: steps.manifest.outputs.active == 'true'
        run: python scripts/gallery_drive_ingest.py

      - name: Stage generated assets atomically
        if: steps.manifest.outputs.active == 'true'
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          slug=$(jq -r '.slug' "$GALLERY_JOB_MANIFEST")
          test -n "$slug"

          mkdir -p docs/gallery/image-jobs/archive
          jq 'walk(if type == "object" then del(.source_url) else . end)'             "$GALLERY_JOB_MANIFEST" > "docs/gallery/image-jobs/archive/$slug.json"
          jq -n --arg slug "$slug"             '{schema_version: 1, enabled: false, last_completed_slug: $slug}'             > "$GALLERY_JOB_MANIFEST"

          git add             "public/images/gallery/$slug"             "docs/gallery/image-jobs/results/$slug.json"             "docs/gallery/image-jobs/archive/$slug.json"             "$GALLERY_JOB_MANIFEST"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated asset changes to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "slug=$slug" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated gallery assets
        if: steps.stage.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          slug="${{ steps.stage.outputs.slug }}"
          project=$(jq -r '.project' "docs/gallery/image-jobs/archive/$slug.json")
          git config user.name "Form & Frame Gallery Ingest"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Gallery ingest: $project"

      - name: Verify committed Git blob SHAs
        if: steps.stage.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          slug="${{ steps.stage.outputs.slug }}"
          report="docs/gallery/image-jobs/results/$slug.json"
          jq -r '.images[] | .webp.path, .avif.path' "$report" | while read -r asset; do
            expected=$(git hash-object "$asset")
            committed=$(git ls-tree HEAD "$asset" | awk '{print $3}')
            test -n "$committed"
            test "$expected" = "$committed"
            echo "SHA VERIFIED $asset $committed"
          done

      - name: Push verified commit
        if: steps.stage.outputs.changed == 'true'
        run: git push origin "HEAD:${{ github.ref_name }}"
